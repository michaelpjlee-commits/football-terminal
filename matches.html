 $("tb").innerHTML='<tr><th>GW</th><th>Date</th><th>Home</th><th class="sc">Score</th><th>Away</th><th></th></tr>'+L.map((m,i)=>`<tr class="m${m===cur?" on":""}" data-i="${i}"><td>${m.gw}</td><td>${esc(m.d)}</td><td>${esc(m.h)}</td><td class="sc">${m.hg}-${m.ag}</td><td>${esc(m.a)}</td><td>${m.rep?'<a style="color:var(--green)" href="'+m.rep+'">REPORT &#8599;</a>':''}</td></tr>`).join("");
 card();}
$("gw").onchange=e=>{gwSel=e.target.value;const L=list();if(L.length&&!L.includes(cur))cur=L[0];draw()};
$("tm").onchange=e=>{tmSel=e.target.value;const L=list();if(L.length&&!L.includes(cur))cur=L[0];draw()};
$("mt").onchange=e=>{cur=list()[+e.target.value];draw()};
$("tb").onclick=e=>{if(e.target.closest("a"))return;const r=e.target.closest("tr.m");if(r){cur=list()[+r.dataset.i];draw();window.scrollTo({top:0,behavior:"smooth"})}};
draw();
</script></body></html>
